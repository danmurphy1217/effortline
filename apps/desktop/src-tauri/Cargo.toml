[package]
name = "effortline-desktop"
version.workspace = true
description = "Local-first athlete investigation desktop app"
authors = ["Effortline contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "effortline_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
effortline-core = { path = "../../../crates/effortline-core" }
serde = { version = "1", features = ["derive"] }
getrandom = "0.4.3"
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
